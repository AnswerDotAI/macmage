[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macmage"
dynamic = ["version"]
description = "Terminal-native Python automation for macOS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = ['cfloop>=0.1.0', 'fastcore>=2.1.14', 'pyobjc-framework-Cocoa>=12.2.1', 'pyobjc-framework-Quartz>=12.2.1',
    'pyobjc-framework-ApplicationServices>=12.2.1', 'pyobjc-framework-Contacts>=12.2.1',
    'pyobjc-framework-EventKit>=12.2.1', 'pyobjc-framework-Photos>=12.2.1',
    'pyobjc-framework-Speech>=12.2.1', 'pyobjc-framework-AVFoundation>=12.2.1']

[project.scripts]
macmage = "macmage:main"

[project.optional-dependencies]
dev = [
  "fastship",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/macmage"

[tool.setuptools.dynamic]
version = { attr = "macmage.__version__" }

[tool.setuptools.packages.find]
include = ["macmage"]

[tool.pytest.ini_options]
markers = ["visible: puts something on screen; deselected by default"]
addopts = "-m 'not visible'"
